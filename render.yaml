services:
  - type: web
    name: rsmts-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false          # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false          # Set manually in Render dashboard
    healthCheckPath: /system/health
    autoDeploy: true
